# Builds libstrata.dll: the Strata compiler as a library (API: strata.h).
#   stratac build compiler/api        (build.ps1 does this)
[project]
name    = "libstrata"
entry   = "../src/libstrata.strata"
output  = "dll"
out_dir = "../bin"

[build]
release      = true
split        = false          # strata_host.h keeps process state in `static`s: one C file
include_dirs = ["../src"]    # strata_host.h lives beside the compiler's sources
